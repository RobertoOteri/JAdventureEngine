spring.application.name=jadventure-backend

# --- Database PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/adventure_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-validate=true

# --- JWT Configuration ---
jwt.secret=Guarda_dietro_di_te_una_scimmia_a_tre_teste_Guybrush_Threepwood_1990
jwt.expiration-ms=86400000

# --- File Upload Configuration ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB