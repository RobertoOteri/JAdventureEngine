<header class="editor-navbar">
  <div class="navbar-left">
    <button type="button" class="btn-nav-back" (click)="goBackToAdventures()" title="Torna all'elenco avventure">
      <i class="bi bi-chevron-left"></i>
      <span>Avventure</span>
    </button>

    <div class="nav-divider"></div>

    <div class="adventure-title-group">
      <h1 class="adventure-main-title">
        {{ store.adventureTitle() || 'Avventura Grafica' }}
      </h1>
      <button
        type="button"
        class="btn-edit-title"
        (click)="editAdventureRequested.emit()"
        title="Modifica informazioni avventura"
      >
        <i class="bi bi-pencil-square"></i>
      </button>
    </div>
  </div>

  <div class="navbar-right">
    @if (draftPointsCount() > 0) {
      <div class="draft-pill">
        <i class="bi bi-vector-pen"></i>
        <span>{{ draftPointsCount() }} vertici</span>
        <button type="button" class="btn-undo-point" (click)="undoPoint.emit()" title="Annulla ultimo vertice">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
      </div>
    }

    <div class="status-indicator">
      <span class="status-dot"></span>
      <span class="scene-active-tag">{{ store.currentScene()?.name || 'Stanza non selezionata' }}</span>
    </div>
  </div>
</header>
