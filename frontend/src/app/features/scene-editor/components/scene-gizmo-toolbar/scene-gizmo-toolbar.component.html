<div class="gizmo-toolbar-card">
  <button
    type="button"
    class="btn-tool"
    [class.active]="activeTool() === 'SELECT'"
    (click)="selectTool('SELECT')"
    [title]="'sceneEditor.gizmo.select' | t"
  >
    <i class="bi bi-cursor-fill icon-tool"></i>
  </button>

  @if (hasSprite()) {
    <div class="tool-divider"></div>

    <button
      type="button"
      class="btn-tool"
      [class.active]="activeTool() === 'MOVE'"
      (click)="selectTool('MOVE')"
      [title]="'sceneEditor.gizmo.move' | t"
    >
      <i class="bi bi-arrows-move icon-tool"></i>
    </button>

    <button
      type="button"
      class="btn-tool"
      [class.active]="activeTool() === 'SCALE'"
      (click)="selectTool('SCALE')"
      [title]="'sceneEditor.gizmo.scale' | t"
    >
      <i class="bi bi-aspect-ratio icon-tool"></i>
    </button>
  }

  <div class="tool-divider"></div>

  <button
    type="button"
    class="btn-tool"
    [class.active]="activeTool() === 'HOTSPOT'"
    (click)="selectTool('HOTSPOT')"
    [title]="'sceneEditor.gizmo.hotspot' | t"
  >
    <i class="bi bi-pencil-fill icon-tool"></i>
  </button>
</div>
