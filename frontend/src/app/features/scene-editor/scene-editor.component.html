<div class="editor-shell">
  <app-editor-header
    (editAdventureRequested)="openAdventureModal()"
  />

  <div class="editor-workspace">
    <app-scenes-sidebar
      (startCreateItemRequested)="startNewHotspot()"
    />

    <app-scene-canvas
      #canvasRef
      [isEditingOrCreating]="isEditingOrCreating()"
      [editingItemCode]="editingItemCode()"
      [previewSpriteUrl]="previewSpriteUrl()"
      [spritePosX]="spritePosX()"
      [spritePosY]="spritePosY()"
      [spriteWidth]="spriteWidth()"
      [spriteHeight]="spriteHeight()"
      (transformChange)="onTransformChange($event)"
      (fileDropped)="onFileDropped($event)"
      (createSceneRequested)="goToAddScene()"
    />

    <app-inspector-sidebar
      [isEditingOrCreating]="isEditingOrCreating()"
      [editingItemCode]="editingItemCode()"
      [draftPointsCount]="canvasRef?.draftPoints()?.length || 0"
      [itemName]="itemName()"
      [itemCode]="itemCode()"
      [itemDescription]="itemDescription()"
      [isCollectible]="isCollectible()"
      [isInitiallyVisible]="isInitiallyVisible()"
      [sceneImageFile]="sceneImageFile()"
      [previewSpriteUrl]="previewSpriteUrl()"
      (startCreateRequested)="startNewHotspot()"
      (editItemRequested)="editExistingItem($event)"
      (cancelDraftRequested)="cancelDraft()"
      (saveDraftRequested)="saveDraft()"
      (deleteItemRequested)="deleteItem($event)"
      (itemNameChange)="onNameChange($event)"
      (itemCodeChange)="itemCode.set($event)"
      (itemDescriptionChange)="itemDescription.set($event)"
      (isInitiallyVisibleChange)="isInitiallyVisible.set($event)"
      (sceneImageSelected)="onSceneFileSelected($event)"
      (openAddActionRequested)="openAddAction()"
      (editActionRequested)="openEditAction($event)"
      (deleteActionRequested)="onDeleteAction($event)"
      (openDialoguesRequested)="openDialogues($event)"
    />
  </div>

  @if (isActionModalOpen() && store.selectedItem()) {
    <app-action-modal
      [itemCode]="store.selectedItem()!.code"
      [actionToEdit]="editingAction()"
      (saveRequested)="onSaveAction($event)"
      (closeRequested)="closeActionModal()"
    />
  }

  @if (isAdventureModalOpen() && store.adventure()) {
    <app-adventure-create
      [isModal]="true"
      [initialAdventure]="store.adventure()"
      [scenes]="store.scenes()"
      (saved)="onSaveAdventureDetails($event)"
      (closeRequested)="isAdventureModalOpen.set(false)"
    />
  }
</div>
