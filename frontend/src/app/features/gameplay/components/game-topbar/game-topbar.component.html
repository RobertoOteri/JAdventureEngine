<header class="game-navbar">
  <div class="navbar-left">
    <button type="button" class="btn-nav-action" (click)="goBack.emit()" title="Torna all'elenco avventure">
      <i class="bi bi-chevron-left"></i>
      <span>Lobby</span>
    </button>

    <div class="nav-divider"></div>

    <div class="adventure-title-group">
      <h1 class="adventure-main-title">{{ adventureTitle() }}</h1>
    </div>
  </div>

  <div class="navbar-right">
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span class="scene-active-tag">{{ sceneName() }}</span>
    </div>

    <button type="button" class="btn-inventory-trigger" (click)="openInventory.emit()" title="Apri Inventario">
      <i class="bi bi-briefcase-fill"></i>
      <span>Borsa</span>
      <span class="inventory-badge">{{ inventoryCount() }}</span>
    </button>

    <button type="button" class="btn-menu-trigger" (click)="openPauseMenu.emit()" title="Menu di Pausa (ESC)">
      <i class="bi bi-list"></i>
      <span>Menu</span>
    </button>
  </div>
</header>
