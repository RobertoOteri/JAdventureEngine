<div class="dialogue-stage" (click)="onStageClick()">
  <div class="dialogue-composition">

    @if (hasChoices()) {
      <ul class="choices-list" [class.revealed]="isNodeReady()" [attr.aria-label]="'gameplay.dialogue.choicesAria' | t">        @for (choice of node().choices; track choice.id ?? $index) {
          <li class="choice-item" [style.--index]="$index">
            <button
              type="button"
              class="choice-btn"
              [class.selected]="selectedIndex() === $index"
              [attr.aria-current]="selectedIndex() === $index"
              (mouseenter)="selectedIndex.set($index)"
              (click)="onChoose(choice, $event)"
            >
              <svg class="choice-arrow" viewBox="0 0 12 12" aria-hidden="true">
                <path d="M2 1 L10 6 L2 11 Z" />
              </svg>
              <span class="choice-text">{{ choice.text }}</span>
            </button>
          </li>
        }
      </ul>
    }

    <p class="speech-prose"><span>{{ displayedText() }}</span>@if (!isTypingComplete()) {<span class="type-cursor" aria-hidden="true">▌</span>}<span class="speech-ghost" aria-hidden="true">{{ remainingText() }}</span></p>

    @if (!hasChoices() && isNodeReady()) {
      <button type="button" class="continue-btn" (click)="onClose($event)">
        <span>{{ 'gameplay.dialogue.continue' | t }}</span>
        <svg class="choice-arrow" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2 1 L10 6 L2 11 Z" />
        </svg>
      </button>
    }

  </div>
</div>
