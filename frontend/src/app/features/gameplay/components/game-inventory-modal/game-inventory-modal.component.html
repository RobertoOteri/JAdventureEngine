<div class="modal-backdrop" (click)="close.emit()">
  <div class="parchment-container" (click)="$event.stopPropagation()">

    <div class="parchment-backpack-badge" title="Zaino del protagonista">
      <i class="bi bi-backpack4 backpack-icon"></i>
    </div>

    <button type="button" class="btn-parchment-close" (click)="close.emit()" title="Chiudi inventario">
      <i class="bi bi-x-lg"></i>
    </button>

    <div class="parchment-header">
      <h3 class="parchment-title">Inventario</h3>
    </div>

    <div class="parchment-body custom-scroll">
      <div class="inventory-grid">
        @for (item of items(); track item.code) {
          <div
            class="item-pocket"
            [class.active]="selectedItem?.code === item.code"
            (click)="selectItem(item)"
          >
            <div class="pocket-placeholder">
              <i class="bi bi-box-seam pocket-item-icon"></i>
            </div>
            <span class="pocket-label">{{ item.name }}</span>
          </div>
        } @empty {
          <div class="empty-parchment">
            <i class="bi bi-inbox empty-icon"></i>
            <p>Il tuo borsello è completamente vuoto...</p>
          </div>
        }
      </div>

      @if (selectedItem) {
        <div class="inspector-plate">
          <div class="inspector-plate-header">
            <span class="inspector-item-title">{{ selectedItem.name }}</span>
            <span class="inspector-item-code">#{{ selectedItem.code }}</span>
          </div>
          <p class="inspector-item-desc">
            {{ selectedItem.description || 'Nessun dettaglio particolare su quest\'oggetto.' }}
          </p>
        </div>
      }
    </div>

    <div class="parchment-footer">
      <button type="button" class="btn-roll-up" (click)="close.emit()">
        <i class="bi bi-box-arrow-left"></i>
        <span>Riponi nello zaino</span>
      </button>
    </div>

  </div>
</div>
