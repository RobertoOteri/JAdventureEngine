<div class="cursor-root" [style.left.px]="x()" [style.top.px]="y()">
  <div class="orb">
    <svg class="orb-ring-svg" viewBox="0 0 80 80" aria-hidden="true">
      <defs>
        <linearGradient id="goldBevel" x1="15%" y1="10%" x2="85%" y2="90%">
          <stop offset="0%" stop-color="#fff3c4" />
          <stop offset="28%" stop-color="#e5b357" />
          <stop offset="65%" stop-color="#b87b28" />
          <stop offset="100%" stop-color="#5e3a0e" />
        </linearGradient>

        <linearGradient id="tipHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
          <stop offset="60%" stop-color="#f3cf7a" stop-opacity="0.15" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </linearGradient>
      </defs>

      <path
        class="orb-pointer-beak"
        d="M 52 14 L 66.5 11.5 Q 69.5 11 69 14 L 66 28 Z"
      />

      <path
        class="orb-pointer-shine"
        d="M 53.5 14.5 L 66 12.2 Q 67.8 12 67.4 13.8 L 61 20 Z"
      />

      <circle
        class="orb-ring-circle"
        cx="38"
        cy="42"
        r="30.5"
      />
    </svg>

    @if (item()?.imageUrl; as img) {
      <img [src]="img" [alt]="item()?.name" class="orb-img" />
    } @else {
      <i class="bi bi-box-seam orb-fallback"></i>
    }
  </div>

  <div class="plaque" [class.above]="plaqueAbove()" [style.--shift]="plaqueShift() + 'px'">
    <div class="plaque-title">{{ targetName() || item()?.name }}</div>
    <div class="plaque-sentence">{{ sentence() }}</div>
  </div>
</div>
