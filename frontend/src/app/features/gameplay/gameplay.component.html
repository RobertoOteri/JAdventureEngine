<div class="gameplay-shell">
  <app-game-topbar
    [adventureTitle]="adventureDetails()?.title ?? ''"
    [sceneName]="store.currentScene()?.name || ('gameplay.waiting' | t)"
    [inventoryCount]="store.inventoryCount()"
    (openInventory)="store.setInventoryOpen(true)"
    (openPauseMenu)="store.setPauseMenuOpen(true)"
    (goBack)="onExitToLobby()"
  />

  <div class="gameplay-workspace">
    <app-game-viewport
      [scene]="store.currentScene()"
      [backgroundUrl]="store.currentSceneBackgroundUrl()"
      [visibleItemCodes]="store.visibleItemCodes()"
      [feedbackMessage]="store.feedbackMessage()"
      [playTimeSeconds]="store.gameState()?.playTime || 0"
      [isDragging]="store.draggedItem.isDragging()"
      [inputOverlay]="store.inputOverlay()"
      (itemClicked)="store.openRadialMenu($event.item, $event.mouseX, $event.mouseY)"
      (singleActionTriggered)="onExecuteAction($event)"
      (canvasClicked)="store.closeRadialMenu()"
      (hotspotHover)="store.setDragTarget($event?.name ?? null, $event?.code ?? null)"
      (hotspotDrop)="store.dropOnSceneTarget($event)"
      (inputValueChange)="store.setInputValue($event)"
      (inputSubmitted)="store.submitInput()"
      (inputDismissed)="store.closeInputOverlay()"
    />

    <app-game-message-banner
      [message]="store.feedbackMessage()"
      [raised]="store.isInventoryOpen()"
    />
  </div>

  @if (store.draggedItem.isDragging()) {
    <app-game-drag-cursor
      [x]="store.draggedItem.x()"
      [y]="store.draggedItem.y()"
      [item]="store.draggedItem.item()"
      [targetName]="store.draggedItem.targetHoveredName()"
    />
  }

  @if (store.radialMenu.isOpen()) {
    <app-game-radial-menu
      [x]="store.radialMenu.x()"
      [y]="store.radialMenu.y()"
      [item]="store.radialMenu.item()"
      (actionSelected)="onExecuteAction($event)"
      (close)="store.closeRadialMenu()"
    />
  }

  <app-game-inventory-modal
    [open]="store.isInventoryOpen()"
    [items]="store.inventory()"
    [isDragging]="store.draggedItem.isDragging()"
    [draggedItemCode]="store.draggedItem.item()?.code ?? null"
    (itemDragStart)="store.startDragItem($event.item, $event.x, $event.y)"
    (slotHover)="store.setDragTarget($event?.name ?? null, $event?.code ?? null)"
    (slotDrop)="store.dropOnInventoryTarget($event)"
    (close)="store.setInventoryOpen(false)"
  />

  @if (store.activeDialogue(); as dialogue) {
    <app-game-dialogue-overlay
      [node]="dialogue"
      (choiceSelected)="store.chooseDialogueOption($event)"
      (close)="store.closeDialogue()"
    />
  }

  @if (store.isPauseMenuOpen()) {
    <app-game-pause-modal
      [saves]="store.savesList()"
      (resume)="store.setPauseMenuOpen(false)"
      (save)="onSaveGame($event)"
      (load)="store.loadGame($event)"
      (exit)="onExitToLobby()"
    />
  }

  @if (store.isCompleted()) {
    <app-game-ending-modal
      [adventureTitle]="adventureDetails()?.title ?? ''"
      [adventureId]="store.adventureId() ?? 0"
      [message]="store.endingMessage()"
      [playTimeSeconds]="store.gameState()?.playTime || 0"
      (continueGame)="onContinue()"
      (exit)="onExitToLobby()"
    />
  }

  @if (isLaunchModalOpen()) {
    <app-game-launch-modal
      [adventureTitle]="adventureDetails()?.title ?? ''"
      [coverUrl]="adventureDetails()?.coverImageUrl ?? ''"
      [saves]="store.savesList()"
      [loading]="!store.areSavesLoaded()"
      [versions]="versions()"
      [selectedVersionId]="store.adventureId()"
      (startNew)="onStartNew()"
      (continueGame)="onContinue()"
      (loadSave)="onLoadSave($event)"
      (cancel)="onExitToLobby()"
      (versionChange)="onVersionChange($event)"
    />
  }
</div>
