<div class="shell-layout">
  <app-sidebar />

  <main class="content-body">
    <header class="masthead">
      <div class="masthead-text">
        <h1>Libreria Avventure</h1>
        <span class="counter">{{ adventures().length }} titoli registrati</span>
      </div>

      <button
        type="button"
        class="fab-add"
        (click)="goToCreate()"
        title="Crea nuova avventura"
        aria-label="Crea nuova avventura"
      >
        <i class="bi bi-plus-lg fab-cross"></i>
      </button>
    </header>

    <div class="divider"></div>

    @if (loading()) {
      <div class="empty-wrap">
        <div class="loader"></div>
      </div>
    } @else {
      <div class="catalog-grid">
        @for (adv of adventures(); track adv.id ?? adv.code) {
          <app-adventure-card
            [adventure]="adv"
            (play)="onPlayAdventure($event)"
            (info)="selectedAdventure.set($event)"
          />
        } @empty {
          <div class="empty-wrap">
            <i class="bi bi-journal-album empty-icon"></i>
            <p>Nessun'avventura disponibile nella libreria.</p>
            <button type="button" class="btn-create-first" (click)="goToCreate()">
              <i class="bi bi-plus-lg"></i> Crea la prima storia
            </button>
          </div>
        }
      </div>
    }
  </main>

  @if (selectedAdventure()) {
    <app-adventure-detail-modal
      [adventure]="selectedAdventure()!"
      (close)="selectedAdventure.set(null)"
      (play)="onPlayAdventure(selectedAdventure()!)"
    />
  }
</div>
