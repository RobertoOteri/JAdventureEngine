<div class="shell-layout">

  <main class="content-body">
    <header class="masthead">
      <div class="masthead-text">
        <span class="kicker">{{ 'library.kicker' | t }}</span>
        <h1>{{ 'library.title' | t }}</h1>
        <p class="subtitle">{{ 'library.subtitle' | t }}</p>
      </div>
    </header>

    <div class="divider"></div>

    <div class="toolbar">
      <app-search-bar
        [value]="query()"
        (valueChange)="query.set($event)"
        [placeholder]="'library.searchPlaceholder' | t"
      />
      <div class="toolbar-filters">
        <app-filter-select
          icon="bi-sort-down"
          [options]="sortOptions"
          [value]="sort()"
          (valueChange)="sort.set($event)"
        />
      </div>
    </div>

    @if (loading()) {
      <div class="empty-wrap loader-wrap">
        <div class="loader"></div>
      </div>
    } @else {
      <div class="catalog-grid">
        @for (adv of filteredAdventures(); track adv.id ?? adv.code) {
          <app-adventure-card
            [adventure]="adv"
            [showFavorite]="true"
            [isFavorite]="favoriteService.favoriteCodes().has(adv.code)"
            (play)="onPlayAdventure($event)"
            (info)="openDetail($event)"
            (favoriteToggle)="favoriteService.toggle($event)"
          />
        } @empty {
          @if (adventures().length > 0) {
            <div class="empty-wrap">
              <i class="bi bi-search empty-icon"></i>
              <p>{{ 'library.noMatch' | t }}</p>
              <button type="button" class="btn-create-first" (click)="resetFilters()">
                <i class="bi bi-x-lg"></i> {{ 'library.resetSearch' | t }}
              </button>
            </div>
          } @else {
            <div class="empty-wrap">
              <i class="bi bi-journal-album empty-icon"></i>
              <p>{{ 'library.empty' | t }}</p>
            </div>
          }
        }
      </div>
    }
  </main>
</div>
