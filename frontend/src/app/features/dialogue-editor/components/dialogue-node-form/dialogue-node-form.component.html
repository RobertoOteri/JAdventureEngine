<section class="node-form">
  @if (store.selectedNode(); as node) {
    <div class="column-scroll">
      <div class="form-card">
        <div class="card-head">
          <h3>{{ 'dialogueEditor.nodeText' | t }}</h3>
          <span class="node-code">#{{ node.code.slice(0, 8) }}</span>
        </div>
        <textarea
          class="studio-input studio-textarea"
          rows="8"
          maxlength="3000"
          [placeholder]="'dialogueEditor.nodeTextPlaceholder' | t"
          [ngModel]="node.text"
          (ngModelChange)="onNodeText(node.code, $event)"
        ></textarea>
      </div>

      <div class="form-card">
        <div class="card-head">
          <h3>{{ 'dialogueEditor.nodeEffects' | t }}</h3>
        </div>
        <p class="card-hint">{{ 'dialogueEditor.nodeEffectsHint' | t }}</p>
        <app-effects-editor
          [effects]="node.effects"
          [dialogueNodes]="store.nodes()"
          [dialogueMode]="true"
          [excludedTypes]="['START_DIALOGUE']"
          [emptyHint]="'dialogueEditor.nodeEffectsEmpty' | t"
          (effectsChange)="onNodeEffects(node.code, $event)"
        />
      </div>
    </div>
  } @else {
    <div class="form-empty">
      <i class="bi bi-chat-square-text empty-icon"></i>
      <p [innerHTML]="'dialogueEditor.noSelection' | t"></p>
    </div>
  }
</section>
