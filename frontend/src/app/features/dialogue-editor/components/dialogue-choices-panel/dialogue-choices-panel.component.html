@if (store.selectedNode(); as node) {
  <aside class="choices-column">
    <div class="list-header">
      <div class="header-title">
        <i class="bi bi-chat-left-text icon-header"></i>
        <h2>{{ 'dialogueEditor.choices' | t: { count: node.choices.length } }}</h2>
      </div>
      <button type="button" class="btn-add-choice" (click)="addChoice(node.code, node.choices.length)">
        <i class="bi bi-plus-lg"></i>
        <span>{{ 'dialogueEditor.addChoice' | t }}</span>
      </button>
    </div>

    <div class="choices-scroll">
      @for (choice of node.choices; track $index) {
        <div class="choice-item" [class.open]="expandedChoice() === $index">
          <div class="choice-header">
            <button
              type="button"
              class="choice-toggle"
              [attr.aria-expanded]="expandedChoice() === $index"
              (click)="toggleChoice($index)"
            >
              <i
                class="bi chevron"
                [class.bi-chevron-right]="expandedChoice() !== $index"
                [class.bi-chevron-down]="expandedChoice() === $index"
              ></i>
              <span class="choice-summary">
                <span class="choice-title" [class.is-empty]="!choice.text.trim()">
                  {{ choice.text.trim() || ('dialogueEditor.untitledChoice' | t) }}
                </span>
                <span class="choice-target">
                  <i class="bi bi-arrow-return-right"></i>
                  {{ targetLabel(choice) }}
                </span>
              </span>
              <span class="choice-badges">
                @if (choice.preconditions.length) {
                  <span class="badge badge-pre">
                    @if (choice.preconditions.length === 1) {
                      {{ 'dialogueEditor.preconditionCountOne' | t }}
                    } @else {
                      {{ 'dialogueEditor.preconditionCount' | t: { count: choice.preconditions.length } }}
                    }
                  </span>
                }
                @if (effectsCount(choice) > 0) {
                  <span class="badge badge-eff">
                    @if (effectsCount(choice) === 1) {
                      {{ 'dialogueEditor.effectCountOne' | t }}
                    } @else {
                      {{ 'dialogueEditor.effectCount' | t: { count: effectsCount(choice) } }}
                    }
                  </span>
                }
              </span>
            </button>
            <button
              type="button"
              class="btn-del-choice"
              [title]="'dialogueEditor.deleteChoice' | t"
              [attr.aria-label]="'dialogueEditor.deleteChoice' | t"
              (click)="removeChoice(node.code, $index)"
            >
              <i class="bi bi-trash3"></i>
            </button>
          </div>

          @if (expandedChoice() === $index) {
            <div class="choice-body">
              <div class="field">
                <label class="field-label">{{ 'dialogueEditor.choiceText' | t }}</label>
                <input
                  type="text"
                  class="studio-input"
                  maxlength="1000"
                  [placeholder]="'dialogueEditor.choiceTextPlaceholder' | t"
                  [ngModel]="choice.text"
                  (ngModelChange)="onChoiceText(node.code, $index, $event)"
                />
              </div>

              <div class="field">
                <label class="field-label">
                  <i class="bi bi-arrow-return-right"></i> {{ 'dialogueEditor.leadsTo' | t }}
                </label>
                <select
                  class="studio-select"
                  [ngModel]="targetValue(choice)"
                  (ngModelChange)="onChoiceTarget(node.code, $index, $event)"
                >
                  <option [ngValue]="null" disabled>{{ 'dialogueEditor.selectTarget' | t }}</option>
                  <option [value]="END_VALUE">{{ 'dialogueEditor.endDialogue' | t }}</option>
                  @for (target of store.nodes(); track target.code) {
                    <option [ngValue]="target.code">
                      {{ nodeLabel(target) }}{{ target.code === node.code ? ' ' + ('dialogueEditor.thisNode' | t) : '' }}
                    </option>
                  }
                </select>
              </div>

              <div class="field">
                <label class="field-label">
                  {{ 'dialogueEditor.preconditions' | t }}
                  <span class="field-sub">{{ 'dialogueEditor.preconditionsHint' | t }}</span>
                </label>
                <app-preconditions-editor
                  [preconditions]="choice.preconditions"
                  [dialogueNodes]="store.nodes()"
                  (preconditionsChange)="onChoicePreconditions(node.code, $index, $event)"
                />
              </div>

              <div class="field">
                <label class="field-label">
                  {{ 'dialogueEditor.effects' | t }}
                  <span class="field-sub">{{ 'dialogueEditor.effectsHint' | t }}</span>
                </label>
                <app-effects-editor
                  [effects]="choice.effects"
                  [dialogueNodes]="store.nodes()"
                  [dialogueMode]="true"
                  [excludedTypes]="['START_DIALOGUE']"
                  (effectsChange)="onChoiceEffects(node.code, $index, $event)"
                />
              </div>
            </div>
          }
        </div>
      } @empty {
        <div class="choices-empty">
          <i class="bi bi-info-circle"></i>
          <span>{{ 'dialogueEditor.noChoices' | t }}</span>
        </div>
      }
    </div>
  </aside>
}
