<div class="segmented" [class.full]="fullWidth()" [class.compact]="compact()" role="radiogroup" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      class="segment"
      [class.active]="option.value === value()"
      [attr.aria-checked]="option.value === value()"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
