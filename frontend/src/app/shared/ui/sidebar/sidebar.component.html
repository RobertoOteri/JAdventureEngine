<aside class="sidebar">
  <div class="brand">
    <i class="bi bi-controller brand-icon"></i>
    <span class="brand-name">JAdventureEngine</span>
  </div>

  <nav class="nav-menu">
    <a
      routerLink="/adventures"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <i class="bi bi-collection-play nav-icon"></i>
      <span>{{ 'sidebar.library' | t }}</span>
    </a>

    <a
      routerLink="/adventures/my"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="bi bi-hammer nav-icon"></i>
      <span>{{ 'sidebar.myStories' | t }}</span>
    </a>
  </nav>

  <div class="sidebar-user">
    <a routerLink="/profile" routerLinkActive="active" class="user-link" [title]="'sidebar.myProfile' | t">
      <app-user-avatar [src]="user()?.avatarUrl" [name]="username()" [size]="32" />
      <span class="user-name">{{ username() }}</span>
    </a>
    <app-language-switch placement="top" align="end" />
    <button
      type="button"
      class="btn-logout"
      (click)="logout()"
      [title]="'sidebar.logout' | t"
      [attr.aria-label]="'sidebar.logout' | t"
    >
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>
