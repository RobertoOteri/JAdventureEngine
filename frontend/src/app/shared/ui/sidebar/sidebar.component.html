<aside class="sidebar">
  <div class="brand">
    <i class="bi bi-controller brand-icon"></i>
    <span class="brand-name">JAdventureEngine</span>
  </div>

  <nav class="nav-menu">
    <a
      routerLink="/adventures"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <i class="bi bi-collection-play nav-icon"></i>
      <span>Libreria</span>
    </a>

    <a
      routerLink="/adventures/my"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="bi bi-hammer nav-icon"></i>
      <span>Le mie storie</span>
    </a>
  </nav>

  <div class="sidebar-user">
    <a routerLink="/profile" routerLinkActive="active" class="user-link" title="Il mio profilo">
      <app-user-avatar [src]="user()?.avatarUrl" [name]="username()" [size]="32" />
      <span class="user-name">{{ username() }}</span>
    </a>
    <button type="button" class="btn-logout" (click)="logout()" title="Esci" aria-label="Esci">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>
