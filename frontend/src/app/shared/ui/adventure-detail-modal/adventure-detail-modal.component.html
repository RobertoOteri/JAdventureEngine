<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-card">
    <button type="button" class="btn-close" (click)="close.emit()" title="Chiudi">✕</button>

    <div class="modal-banner">
      @if (coverUrl()) {
        <img [src]="coverUrl()" [alt]="adventure().title" class="banner-img" />
      } @else {
        <div class="banner-fallback">
          <span class="banner-icon">🖼️</span>
        </div>
      }
      <div class="banner-overlay"></div>
      <span class="badge-code">{{ adventure().code }}</span>
    </div>

    <div class="modal-content">
      <div class="modal-header">
        <h2 class="adventure-title">{{ adventure().title }}</h2>
        <div class="meta-row">
          <span class="meta-pill author">
            <span class="meta-icon">👤</span> {{ adventure().authorUsername }}
          </span>
          <span class="meta-pill date">
            <span class="meta-icon">📅</span> {{ adventure().createdAt | date:'dd/MM/yyyy HH:mm' }}
          </span>
        </div>
      </div>

      <div class="synopsis-box">
        <label class="synopsis-label">Sinossi & Dettagli</label>
        <p class="synopsis-text">
          {{ adventure().description || 'Nessuna descrizione fornita per questa avventura grafica.' }}
        </p>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="close.emit()">
          Chiudi
        </button>
        <button type="button" class="btn-play-game" (click)="onPlay()">
          <span>▶ Gioca Ora</span>
        </button>
      </div>
    </div>
  </div>
</div>
