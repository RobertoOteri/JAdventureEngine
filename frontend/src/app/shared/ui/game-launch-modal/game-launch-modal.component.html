<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal-dialog-box" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <div class="modal-header-left">
        <div class="icon-wrap">
          <i class="bi bi-controller"></i>
        </div>
        <div>
          <h3>{{ adventureTitle() || ('common.graphicAdventure' | t) }}</h3>
          <span class="modal-subtitle">{{ 'gameLaunch.subtitle' | t }}</span>
        </div>
      </div>
      <button type="button" class="btn-close" (click)="cancel.emit()" [title]="'common.closeWindow' | t">
        <i class="bi bi-x-lg"></i>
      </button>
    </header>

    <div class="modal-body custom-scroll">
      <div class="launch-options">
        <button
          type="button"
          class="btn-launch-option primary"
          [disabled]="!hasSaves()"
          (click)="continueGame.emit()"
          [title]="(hasSaves() ? 'gameLaunch.continueHint' : 'gameLaunch.noPreviousSave') | t"
        >
          <div class="option-icon-box green">
            <i class="bi bi-play-circle-fill"></i>
          </div>
          <div class="option-texts">
            <span class="option-title">{{ 'gameLaunch.continueTitle' | t }}</span>
            <span class="option-desc">{{ 'gameLaunch.continueDesc' | t }}</span>
          </div>
        </button>

        <button
          type="button"
          class="btn-launch-option"
          [disabled]="!hasSaves()"
          (click)="isSavesModalOpen.set(true)"
          [title]="(hasSaves() ? 'gameLaunch.loadHint' : 'gameLaunch.noSaves') | t"
        >
          <div class="option-icon-box cyan">
            <i class="bi bi-folder2-open"></i>
          </div>
          <div class="option-texts">
            <span class="option-title">{{ 'gameLaunch.loadTitle' | t }}</span>
            <span class="option-desc">{{ 'gameLaunch.loadDesc' | t: { count: saves().length } }}</span>
          </div>
        </button>

        <button type="button" class="btn-launch-option new-game" (click)="onNewGameClick()">
          <div class="option-icon-box amber">
            <i class="bi bi-stars"></i>
          </div>
          <div class="option-texts">
            <span class="option-title">{{ 'gameLaunch.newTitle' | t }}</span>
            <span class="option-desc">{{ 'gameLaunch.newDesc' | t }}</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

@if (isSavesModalOpen()) {
  <app-game-saves-modal
    [adventureTitle]="adventureTitle()"
    [saves]="saves()"
    (selectSave)="onSelectSave($event)"
    (close)="isSavesModalOpen.set(false)"
  />
}

@if (isConfirmOverwriteOpen()) {
  <app-confirmation-modal
    [title]="'gameLaunch.confirmNewTitle' | t"
    [message]="'gameLaunch.confirmNewMessage' | t"
    [confirmText]="'gameLaunch.confirmNewOk' | t"
    [cancelText]="'common.cancel' | t"
    [isDestructive]="true"
    (confirm)="onConfirmNewGame()"
    (cancel)="isConfirmOverwriteOpen.set(false)"
  />
}
