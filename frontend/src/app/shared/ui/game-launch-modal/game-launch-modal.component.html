<div class="launch-screen">
  <div class="scene-bg" aria-hidden="true">
    @if (coverUrl()) {
      <img [src]="coverUrl()" alt="" class="scene-img" />
    }
  </div>

  <div class="launch-content">
    <span class="launch-kicker">{{ 'gameLaunch.subtitle' | t }}</span>
    <h1 class="launch-title">{{ adventureTitle() || ('common.graphicAdventure' | t) }}</h1>

    @if (versions().length > 1) {
      <div class="launch-version">
        <app-version-select
          [label]="'gameLaunch.version' | t"
          [versions]="versions()"
          [selectedId]="selectedVersionId()"
          (selectedChange)="versionChange.emit($event)"
        />
      </div>
    }

    @if (loading()) {
      <div class="launch-loading" aria-busy="true">
        <span class="launch-spinner"></span>
      </div>
    } @else {
      <div class="launch-options">
        <button
          type="button"
          class="option"
          [class.primary]="hasSaves()"
          [disabled]="!hasSaves()"
          (click)="continueGame.emit()"
          [title]="(hasSaves() ? 'gameLaunch.continueHint' : 'gameLaunch.noPreviousSave') | t"
        >
          <span class="option-icon"><i class="bi bi-play-fill"></i></span>
          <span class="option-title">{{ 'gameLaunch.continueTitle' | t }}</span>
          <span class="option-desc">{{ 'gameLaunch.continueDesc' | t }}</span>
        </button>

        <button
          type="button"
          class="option"
          [disabled]="!hasSaves()"
          (click)="isSavesModalOpen.set(true)"
          [title]="(hasSaves() ? 'gameLaunch.loadHint' : 'gameLaunch.noSaves') | t"
        >
          <span class="option-icon">
            <i class="bi bi-folder2-open"></i>
            @if (hasSaves()) {
              <span class="option-count">{{ saves().length }}</span>
            }
          </span>
          <span class="option-title">{{ 'gameLaunch.loadTitle' | t }}</span>
          <span class="option-desc">{{ 'gameLaunch.loadHint' | t }}</span>
        </button>

        <button
          type="button"
          class="option"
          [class.primary]="!hasSaves()"
          (click)="onNewGameClick()"
        >
          <span class="option-icon"><i class="bi bi-stars"></i></span>
          <span class="option-title">{{ 'gameLaunch.newTitle' | t }}</span>
          <span class="option-desc">{{ 'gameLaunch.newDesc' | t }}</span>
        </button>
      </div>
    }

    <button type="button" class="btn-back" (click)="cancel.emit()">
      <i class="bi bi-arrow-left"></i>
      <span>{{ 'gameplay.ending.exit' | t }}</span>
    </button>
  </div>
</div>

@if (isSavesModalOpen()) {
  <app-game-saves-modal
    [adventureTitle]="adventureTitle()"
    [saves]="saves()"
    (selectSave)="onSelectSave($event)"
    (close)="isSavesModalOpen.set(false)"
  />
}

@if (isConfirmOverwriteOpen()) {
  <app-confirmation-modal
    [title]="'gameLaunch.confirmNewTitle' | t"
    [message]="'gameLaunch.confirmNewMessage' | t"
    [confirmText]="'gameLaunch.confirmNewOk' | t"
    [cancelText]="'common.cancel' | t"
    [isDestructive]="true"
    (confirm)="onConfirmNewGame()"
    (cancel)="isConfirmOverwriteOpen.set(false)"
  />
}
