<label class="version-select">
  <span class="version-label">{{ label() }}</span>
  <select (change)="onChange($event)" [disabled]="versions().length < 2">
    @for (v of versions(); track v.id; let first = $first) {
      <option [value]="v.id" [selected]="v.id === selectedId()">
        v{{ v.versionNumber }}{{ first ? ' · più recente' : '' }}{{ v.publishedAt ? ' · ' + (v.publishedAt | date: 'dd/MM/yyyy') : '' }}
      </option>
    }
  </select>
</label>
